<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#EEF1EC">
<title>Lessico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EC; --surface:#FFFFFF; --ink:#1B2730; --muted:#5E6B73; --line:#D3DAD4;
  --signal:#1F5FBF; --signal-ink:#FFFFFF; --ok:#1C7A45; --ok-bg:#E2F2E8; --ko:#BF3328; --ko-bg:#FBE6E3;
  --star:#D99A00; --star-bg:#FFF4D6;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --ui:"Figtree", -apple-system, "Helvetica Neue", Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141B20; --surface:#1D262D; --ink:#E9EEEA; --muted:#9AA7AE; --line:#2E3A42;
    --signal:#5B93E8; --signal-ink:#0E1620; --ok:#5CC48A; --ok-bg:#16301F; --ko:#F07A6E; --ko-bg:#3A1C19;
    --star:#F2B829; --star-bg:#352A0E;
  }
}
:root[data-theme="dark"]{
  --bg:#141B20; --surface:#1D262D; --ink:#E9EEEA; --muted:#9AA7AE; --line:#2E3A42;
  --signal:#5B93E8; --signal-ink:#0E1620; --ok:#5CC48A; --ok-bg:#16301F; --ko:#F07A6E; --ko-bg:#3A1C19;
  --star:#F2B829; --star-bg:#352A0E;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding:0 18px}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 8px}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface)}
.iconbtn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round}
.dir{height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px;letter-spacing:.02em}
.dir .arrow{color:var(--signal)}
.bar .mid{flex:1;text-align:center;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* screens */
.screen{flex:1;display:none;flex-direction:column;min-height:0}
.screen.on{display:flex}

/* home */
.home{justify-content:center;align-items:flex-start;padding-bottom:12vh}
.home h1{font-family:var(--display);font-weight:700;font-size:clamp(64px,22vw,104px);line-height:.9;letter-spacing:-.03em;margin:0 0 18px}
.home h1 .en{display:block;color:var(--signal)}
.home p{margin:0 0 6px;color:var(--muted);max-width:30ch}
.home .now{margin:22px 0 28px;font-weight:600;color:var(--ink)}
.start{width:100%;height:64px;border-radius:18px;background:var(--signal);color:var(--signal-ink);font-size:20px;font-weight:600}
.start:active{transform:scale(.985)}

/* drill */
.drill{padding-top:4px}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--signal);transition:width .25s}
.count{font-size:13px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.word{font-family:var(--display);font-weight:700;text-align:center;font-size:clamp(34px,10vw,52px);line-height:1.05;letter-spacing:-.02em;overflow-wrap:anywhere;margin:0 0 6px}
.note{text-align:center;color:var(--muted);font-size:15px;min-height:22px;margin-bottom:22px}
.answer{width:100%;height:56px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:500 19px var(--ui);padding:0 16px;text-align:center;-webkit-appearance:none}
.answer:focus{border-color:var(--signal);outline:none}
.answer.ok{border-color:var(--ok);background:var(--ok-bg)}
.answer.ko{border-color:var(--ko);background:var(--ko-bg)}
.feedback{min-height:52px;text-align:center;padding:8px 4px 0;font-size:16px}
.feedback .verdict{font-weight:600}
.feedback.ok .verdict{color:var(--ok)}
.feedback.ko .verdict{color:var(--ko)}
.feedback .sol{display:block;color:var(--ink);margin-top:2px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{height:54px;border-radius:14px;font-weight:600;font-size:17px;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}
.btn:active{transform:scale(.98)}
.sub{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.btn.quiet{height:46px;font-size:15px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.quiet svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.btn.starred{background:var(--star-bg);border-color:var(--star);color:var(--ink)}
.btn.starred svg{fill:var(--star);stroke:var(--star)}
.foot{padding:14px 0 14px;display:flex;justify-content:center}
.mic{height:46px;padding:0 18px;border-radius:23px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500}
.mic .dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.mic.live{border-color:var(--ok)}
.mic.live .dot{background:var(--ok);animation:pulse 1.4s infinite}
.mic.err .dot{background:var(--ko)}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.mic.live .dot{animation:none}.progress i{transition:none}}
[hidden]{display:none!important}
.empty{text-align:center;color:var(--muted);max-width:30ch;margin:0 auto}
.empty b{display:block;color:var(--ink);font-size:19px;margin-bottom:6px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,15,20,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(86vw,360px);background:var(--surface);z-index:6;transform:translateX(-102%);transition:transform .22s ease-out;padding:calc(env(safe-area-inset-top,0px) + 18px) 0 calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;overflow-y:auto}
.drawer.on{transform:none}
.drawer h2{font-family:var(--display);font-size:26px;margin:0 20px 12px;letter-spacing:-.01em}
.cat{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:13px 20px;font-size:17px;border-left:4px solid transparent}
.cat small{color:var(--muted);font-size:14px}
.cat.sel{border-left-color:var(--signal);background:color-mix(in srgb,var(--signal) 9%,transparent);font-weight:600}
.cat.star small{color:var(--star)}
.lvl{font-family:var(--display);font-weight:700;font-size:15px;color:var(--muted);letter-spacing:.06em;margin:14px 20px 2px}
.cat.sub{padding-left:36px;font-size:16px}
.feedback .hint{display:block;color:var(--muted);font-size:14px;margin-top:4px}
.sep{height:1px;background:var(--line);margin:10px 20px}
.drawer .tools{margin-top:auto;padding:12px 20px 0;color:var(--muted);font-size:14px}
.link{color:var(--signal);font-weight:600;padding:8px 0;font-size:15px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 80px);transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;display:flex;gap:16px;align-items:center;font-size:15px;opacity:0;pointer-events:none;transition:all .2s;z-index:9;max-width:calc(100% - 36px);width:max-content;justify-content:space-between}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--signal);font-weight:600;filter:brightness(1.4)}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <button class="iconbtn" id="menuBtn" aria-label="Apri categorie"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
    <div class="mid" id="barCat"></div>
    <button class="dir" id="dirBtn" aria-label="Cambia direzione"></button>
  </header>

  <section class="screen home on" id="home">
    <h1>Lessico<span class="en">Lexicon</span></h1>
    <p>Parole di tutti i giorni A2 e B1, più business e automotive.</p>
    <p class="now" id="homeNow"></p>
    <button class="start" id="startBtn">Inizia</button>
  </section>

  <section class="screen drill" id="drill">
    <div class="progress"><i id="prog"></i></div>
    <div class="count"><span id="cnt"></span><span id="score"></span></div>
    <div class="stage" id="stage">
      <div class="empty" id="empty" hidden></div>
      <div id="card">
      <h2 class="word" id="word"></h2>
      <div class="note" id="note"></div>
      <input class="answer" id="answer" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="go" placeholder="Scrivi la traduzione">
      <div class="feedback" id="fb" aria-live="polite"></div>
      <div class="actions">
        <button class="btn" id="checkBtn">Correggi</button>
        <button class="btn primary" id="nextBtn">Avanti</button>
      </div>
      <div class="sub">
        <button class="btn quiet" id="starBtn"><svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg><span>Ricorda</span></button>
        <button class="btn quiet" id="delBtn"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg>Cancella</button>
      </div>
      </div>
    </div>
    <div class="foot"><button class="mic" id="micBtn"><span class="dot"></span><span id="micTxt">Rispondi a voce</span></button></div>
  </section>
</div>

<div class="scrim" id="scrim"></div>
<nav class="drawer" id="drawer" aria-label="Categorie">
  <h2>Categorie</h2>
  <div id="cats"></div>
  <div class="tools">
    <div id="delInfo"></div>
    <button class="link" id="restoreBtn">Ripristina parole cancellate</button>
  </div>
</nav>
<div class="toast" id="toast"><span id="toastTxt"></span><button id="toastBtn">Annulla</button></div>

SUB_NAME.X = "Extra";

function catName(c){
  if(c==="ALL") return "Tutte"; if(c==="STAR") return "Ricorda";
  const [a,b]=c.split(":");
  if(DOM_NAME[a]) return b ? DOM_NAME[a]+" · "+b : "Tutto "+DOM_NAME[a];
  return b ? a+" · "+SUB_NAME[b] : "Tutto "+a;
}

/* ---------- data ---------- */
const items = WORDS.map(([it,en,lvl,sub,dom,dlvl])=>{
  const its = it.split("/").map(s=>s.trim());
  const ens = en.split("/").map(s=>s.trim());
  return {key: it+"|"+ens[0], it:its, en:ens, lvl, sub, dom, dlvl};
});
const norm = s => s.toLowerCase()
  .replace(/\(.*?\)/g," ")
  .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/[’`]/g,"'")
  .replace(/\.\.\./g," ").replace(/[.,;:!?¿¡"]/g," ")
  .replace(/^\s*(to|the|a|an)\s+/," ")
  .replace(/^\s*(il|lo|la|i|gli|le|un|uno|una)\s+/," ")
  .replace(/^\s*(l|un)'\s*/," ")
  .replace(/\s+/g," ").trim();
const byIt = new Map(), byEn = new Map();
for(const w of items){
  for(const s of w.it){const k=norm(s);(byIt.get(k)||byIt.set(k,[]).get(k)).push(w)}
  for(const s of w.en){const k=norm(s);(byEn.get(k)||byEn.set(k,[]).get(k)).push(w)}
}

/* ---------- state ---------- */
const LS = "lessico.v1";
let state = {deleted:[], star:[], dir:"it-en", cat:"ALL", t:0};
try{ const s=JSON.parse(localStorage.getItem(LS)||"null"); if(s) state={...state,...s}; }catch(e){}
if(!isValidCat(state.cat)) state.cat="ALL";
let deleted = new Set(state.deleted), starred = new Set(state.star);
let dbDoc=null, saveTimer=null;
function isValidCat(c){ return c==="ALL"||c==="STAR"||/^(A2|B1)(:(V|N|J|X))?$/.test(c)||/^(BUS|AUT)(:(A2|B1))?$/.test(c); }
function save(){
  state.deleted=[...deleted]; state.star=[...starred]; state.t=Date.now();
  try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){}
  if(dbDoc){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>dbDoc.set({...state}).catch(()=>{}),600); }
}
(async()=>{
  try{
    if(!window.claude) return;
    const db = await claude.use("db"); const user = await claude.use("user");
    if(!db||!user) return;
    const id = await user.id(); if(!id) return;
    dbDoc = db.doc("data/users/"+id+"/state");
    const snap = await dbDoc.get();
    if(snap.exists){
      const r = snap.data();
      if((r.t||0) > (state.t||0)){
        state={...state,...r}; if(!isValidCat(state.cat)) state.cat="ALL";
        deleted=new Set(state.deleted||[]); starred=new Set(state.star||[]);
        try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){}
        renderChrome(); if(current) renderWord();
      }
    } else if(state.t) dbDoc.set({...state}).catch(()=>{});
  }catch(e){}
})();

/* ---------- deck ---------- */
let deck=[], pos=0, current=null, checked=false, right=0, done=0, phase="idle";
function pool(cat){
  const [l,s]=cat.split(":");
  const dom=!!DOM_NAME[l];
  return items.filter(w=>!deleted.has(w.key) && (
    cat==="ALL" || (cat==="STAR" ? starred.has(w.key) :
      dom ? (w.dom===l && (!s || w.dlvl===s)) : (w.lvl===l && (!s || w.sub===s)))));
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function buildDeck(){ deck=shuffle(pool(state.cat)); pos=0; right=0; done=0; }

const $=id=>document.getElementById(id);
const inDrill=()=>$("drill").classList.contains("on");

function show(id){

}
function inDomainCat(){ return !!DOM_NAME[state.cat.split(":")[0]]; }
function prompt(w){ return state.dir==="it-en" ? w.it[0] : w.en[0]; }
function renderWord(){
  clearTimeout(autoT);
  if(!deck.length){
    current=null; phase="idle";
    $("card").hidden=true; $("empty").hidden=false;
    $("empty").innerHTML = state.cat==="STAR"
      ? '<div class="empty"><b>Ricorda è vuota</b>Durante l\'allenamento tocca la stella sotto una parola per aggiungerla qui.</div>'
      : '<div class="empty"><b>Nessuna parola qui</b>Ripristina le parole cancellate dal menu o scegli un\'altra categoria.</div>';
    $("cnt").textContent=""; $("score").textContent=""; $("prog").style.width="0";
    return;
  }
  $("card").hidden=false; $("empty").hidden=true;
  if(pos>=deck.length){ shuffle(deck); pos=0; toast("Giro completato: ricomincio da capo"); }
  current=deck[pos]; checked=false; phase="ask";
  const raw = prompt(current);
  const m = raw.match(/^(.*?)\s*\((.*)\)\s*$/);
  $("word").textContent = m ? m[1] : raw;
  $("note").textContent = (m ? m[2]+" · " : "") + (inDomainCat() || !current.lvl ? DOM_NAME[current.dom]+" · "+current.dlvl : current.lvl+" · "+SUB_NAME[current.sub]);
  const a=$("answer"); a.value=""; a.className="answer";
  a.placeholder = voiceOn ? (state.dir==="it-en" ? "Dilla in inglese…" : "Dilla in italiano…") : (state.dir==="it-en" ? "In inglese…" : "In italiano…");
  $("fb").className="feedback"; $("fb").innerHTML="";
  const s=starred.has(current.key); $("starBtn").classList.toggle("starred",s);
  $("starBtn").querySelector("span").textContent = s ? "In Ricorda" : "Ricorda";
  $("cnt").textContent=(pos+1)+" / "+deck.length;
  $("score").textContent = done ? right+" corrette su "+done : "";
  $("prog").style.width=((pos)/deck.length*100)+"%";
  if(voiceOn) freshListen();
}

/* checking */
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>1)return 2;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function accepted(w){
  const out=new Set();
  if(state.dir==="it-en"){ for(const s of w.it) for(const x of (byIt.get(norm(s))||[])) x.en.forEach(e=>out.add(e)); }
  else { for(const s of w.en) for(const x of (byEn.get(norm(s))||[])) x.it.forEach(e=>out.add(e)); }
  return [...out];
}
function judge(v, spoken){
  if(!v) return "skip";
  const nk=accepted(current).map(norm);
  if(nk.includes(v)) return "ok";
  if(spoken){ // speech may add filler words: accept if an answer appears as whole words
    const pad=" "+v+" ";
    if(nk.some(k=>k && pad.includes(" "+k+" "))) return "ok";
  }
  if(v.length>=5 && nk.some(k=>lev(v,k)===1)) return "near";
  return "ko";
}
function check(spoken){
  if(!current) return null;
  const a=$("answer"), v=norm(a.value);
  const res=judge(v, spoken);
  const main = state.dir==="it-en" ? current.en : current.it;
  const solTxt = main.join(" · ");
  const fb=$("fb");
  if(!checked){ done++; if(res==="ok"||res==="near") right++; }
  checked=true;
  if(res==="ok"){ a.className="answer ok"; fb.className="feedback ok"; fb.innerHTML='<span class="verdict">Giusto</span>'+(main.length>1?'<span class="sol">'+esc(solTxt)+'</span>':''); }
  else if(res==="near"){ a.className="answer ok"; fb.className="feedback ok"; fb.innerHTML='<span class="verdict">Giusto, occhio all\'ortografia</span><span class="sol">'+esc(solTxt)+'</span>'; }
  else { a.className="answer ko"; fb.className="feedback ko"; fb.innerHTML='<span class="verdict">'+(res==="skip"?"Da ripassare":"Sbagliato")+'</span><span class="sol">Corretto: '+esc(solTxt)+'</span>'+(voiceOn?'<span class="hint">Di\' «ok» per andare avanti</span>':''); }
  $("score").textContent = right+" corrette su "+done;
  return res;
}
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function next(){
  if(!current) return;
  if(!checked){ done++; right++; }
  pos++; renderWord();
}

/* actions */
$("startBtn").onclick=()=>{ buildDeck(); show("drill"); renderWord(); };
$("checkBtn").onclick=()=>{ const r=check(false); phase = r==="ok"||r==="near" ? "done" : "wrong"; };
$("nextBtn").onclick=next;
$("answer").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); checked ? next() : $("checkBtn").onclick(); } });
$("starBtn").onclick=()=>{
  if(!current) return;
  if(starred.has(current.key)){ starred.delete(current.key); toast("Tolta da Ricorda"); }
  else { starred.add(current.key); toast("Aggiunta a Ricorda"); }
  save(); const s=starred.has(current.key);
  $("starBtn").classList.toggle("starred",s); $("starBtn").querySelector("span").textContent=s?"In Ricorda":"Ricorda";
  renderChrome();
};
$("delBtn").onclick=()=>{
  if(!current) return;
  const w=current, at=pos;
  deleted.add(w.key); save(); deck.splice(pos,1);
  renderChrome(); renderWord();
  toast("Parola tolta: non la rivedrai", ()=>{ deleted.delete(w.key); save(); deck.splice(at,0,w); pos=at; renderChrome(); renderWord(); });
};
$("dirBtn").onclick=()=>{
  state.dir = state.dir==="it-en"?"en-it":"it-en"; save(); renderChrome();
  if(voiceOn) setMic("live", micLabel());
  if(inDrill()) renderWord();
};
function openMenu(o){ $("drawer").classList.toggle("on",o); $("scrim").classList.toggle("on",o); }
$("menuBtn").onclick=()=>openMenu(true);
$("scrim").onclick=()=>openMenu(false);
$("cats").onclick=e=>{
  const b=e.target.closest(".cat"); if(!b) return;
  state.cat=b.dataset.k; save(); openMenu(false); renderChrome();
  if(inDrill()){ buildDeck(); renderWord(); }
};
$("restoreBtn").onclick=()=>{
  const n=deleted.size; const prev=new Set(deleted);
  deleted.clear(); save(); renderChrome();
  if(inDrill()){ buildDeck(); renderWord(); }
  toast(n+" parole ripristinate", ()=>{ deleted=prev; save(); renderChrome(); if(inDrill()){ buildDeck(); renderWord(); } });
};

let toastT;
function toast(msg, undo){
  $("toastTxt").textContent=msg; const b=$("toastBtn");
  b.style.display=undo?"":"none"; b.onclick=()=>{ hide(); undo&&undo(); };
  $("toast").classList.add("on"); clearTimeout(toastT); toastT=setTimeout(hide, undo?4500:1800);
  function hide(){ $("toast").classList.remove("on"); }
}

/* ---------- voice: answer out loud ----------
   IT→EN listens in English, EN→IT in Italian.
   Right → green ~1.5s, then next word. Wrong → red + solution, say "ok" to go on.
   "ok" on a word you haven't answered skips it (as the Avanti button). */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec=null, voiceOn=false, wake=null, autoT=null, settleT=null, heard="", restartPending=false;
const OK_WORDS = ["ok","okay","o k","avanti","next","vai"];
function micLabel(){ return state.dir==="it-en" ? "In ascolto · rispondi in inglese" : "In ascolto · rispondi in italiano"; }
function setMic(cls, txt){ const m=$("micBtn"); m.className="mic"+(cls?" "+cls:""); $("micTxt").textContent=txt; }
function isOk(v){ return OK_WORDS.some(w=>v===w || v.split(" ").includes(w) && v.split(" ").length<=2); }
function onHeard(text, final){
  if(!inDrill()||!current) return;
  const v=norm(text); if(!v) return;
  if(phase==="ask"){
    $("answer").value=text.trim();
    const r=judge(v,true);
    // a right answer counts immediately; otherwise wait for the phrase to settle
    if(r==="ok"){ return resolveSpoken(); }
    clearTimeout(settleT);
    settleT=setTimeout(resolveSpoken, final?150:900);
  } else if(phase==="wrong" || phase==="done"){
    if(isOk(v)){ clearTimeout(autoT); next(); }
  }
}
function resolveSpoken(){
  clearTimeout(settleT);
  if(phase!=="ask") return;
  const v=norm($("answer").value);
  if(isOk(v) && judge(v,true)!=="ok"){ next(); return; }
  const r=check(true);
  if(r==="ok"||r==="near"){ phase="done"; autoT=setTimeout(()=>{ if(phase==="done") next(); },1500); }
  else { phase="wrong"; }
  freshListen();
}
function freshListen(){ // restart so the next phrase starts clean
  if(!voiceOn) return;
  restartPending=true;
  try{ rec&&rec.abort(); }catch(_){}
  if(!rec) startRec();
}
function startRec(){
  rec=new SR(); rec.lang = state.dir==="it-en" ? "en-US" : "it-IT";
  rec.continuous=true; rec.interimResults=true; rec.maxAlternatives=1;
  rec.onresult=e=>{
    let t="", fin=false;
    for(let i=e.resultIndex;i<e.results.length;i++){ t+=e.results[i][0].transcript; fin=fin||e.results[i].isFinal; }
    onHeard(t, fin);
  };
  rec.onerror=e=>{
    if(e.error==="not-allowed"||e.error==="service-not-allowed"){ voiceOn=false; rec=null; setMic("err","Microfono bloccato: apri in Safari"); keepAwake(false); }
  };
  rec.onend=()=>{ rec=null; restartPending=false; if(voiceOn) setTimeout(()=>{ if(voiceOn && !rec) try{ startRec(); }catch(_){} },120); };
  try{ rec.start(); }catch(_){}
}
async function keepAwake(on){
  try{
    if(on && "wakeLock" in navigator){ wake=await navigator.wakeLock.request("screen"); }
    else if(wake){ await wake.release(); wake=null; }
  }catch(_){}
}
document.addEventListener("visibilitychange",()=>{ if(voiceOn && document.visibilityState==="visible") keepAwake(true); });
$("micBtn").onclick=()=>{
  if(!SR){ setMic("err","Voce non disponibile qui: apri in Safari"); return; }
  voiceOn=!voiceOn;
  if(voiceOn){ setMic("live", micLabel()); keepAwake(true); if(inDrill()) renderWord(); else startRec(); }
  else { clearTimeout(autoT); clearTimeout(settleT); try{ rec&&rec.abort(); }catch(_){} rec=null; setMic("","Rispondi a voce"); keepAwake(false); if(inDrill()) renderWord(); }
};

renderChrome();
</script>
</body>
</html>
